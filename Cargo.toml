[package]
name = "kripton"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
windows = { version = "0.62", features = [
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_UI_WindowsAndMessaging",
] }
windows-future = "0.3"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
