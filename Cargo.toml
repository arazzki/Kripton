[package]
name = "kripton"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Kripton — a native Windows living notch built with Rust and Slint"
license = "MIT"
repository = "https://github.com/arazzki/Kripton"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "raw-window-handle-06",
] }
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
