[package]
name = "kripton"
version = "1.0.0"
edition = "2021"
build = "build.rs"
description = "Kripton — a native Windows living notch built with Rust and Slint"
license = "MIT"
repository = "https://github.com/arazzki/Kripton"

[dependencies]
slint = { version = "1.18.1", default-features = false, features = [
    "backend-winit",
    "renderer-femtovg",
    "compat-1-2",
    "raw-window-handle-06",
] }
windows = { version = "0.62", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Storage_Streams",
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_WinRT",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "webp",
] }
raw-window-handle = "0.6"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
directories = "5.0"

[build-dependencies]
slint-build = "1.18.1"
winresource = "0.1"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
