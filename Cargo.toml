[package]
name = "kripton"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
slint = "1.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
arboard = "3.7"
windows = { version = "0.62", features = [
    "Media_Control",
    "Foundation",
    "Foundation_Collections",
    "Storage_Streams",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_System_Power",
] }
windows-core = "0.62"
windows-future = "0.3"

[build-dependencies]
slint-build = "1.18"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
